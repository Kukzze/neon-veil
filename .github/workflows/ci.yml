name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    env:
      # Same portable CPU target as the test job (see below).
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang mold libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - name: Install Rust 1.82.0
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Native Steamworks path compiles
        run: cargo check -p game_steam --features steam --locked

  test:
    name: Tests (${{ matrix.os }})
    needs: format-and-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Portable CPU target: proc-macros built with target-cpu=native can
      # crash rustc on hosted runners whose CPUs advertise unusable features.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang mold libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - name: Install Rust 1.82.0
        uses: dtolnay/rust-toolchain@1.82.0

      - uses: Swatinem/rust-cache@v2

      - name: Test workspace
        run: cargo test --workspace --locked

  web:
    name: Companion portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/companion
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/companion/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
